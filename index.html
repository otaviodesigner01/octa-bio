<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Otávio Designer — Links</title>
<meta name="description" content="Otávio Designer — HUD de serviços, agência Astrus e portfólio." />
<meta name="theme-color" content="#07070b" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Otávio Designer" />
<meta property="og:description" content="Design & tecnologia. Serviços, agência Astrus e portfólio." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#07070b;
    --white:#f3f4f7;
    --muted:#8a8c96;
    --muted-2:#5c5e68;
    --red:#e52421;
    --red-2:#ff3b34;
    --red-3:#ff7a52;
    --red-deep:#a00000;
    --hud:rgba(255,70,58,.5);
    --hud-soft:rgba(255,70,58,.14);
    --line:rgba(255,255,255,.10);
    --line-2:rgba(255,255,255,.18);
    --ease:cubic-bezier(.16,1,.3,1);
    --fd:"Sora",system-ui,sans-serif;
    --fb:"DM Sans",system-ui,sans-serif;
    --fm:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;min-height:100svh;background:var(--bg);color:var(--white);font-family:var(--fb);line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  ::selection{background:var(--red);color:#fff;}

  /* ---------- fundo: grid HUD + canvas de partículas reativo ---------- */
  .grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,70,58,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,70,58,.045) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask:radial-gradient(120% 90% at 50% 40%,#000 55%,transparent 100%);
    mask:radial-gradient(120% 90% at 50% 40%,#000 55%,transparent 100%);}
  #net{position:fixed;inset:0;z-index:1;display:block;}
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(60% 45% at 50% 34%,rgba(7,7,11,.5) 0%,transparent 70%),
    radial-gradient(140% 120% at 50% 0%,transparent 55%,rgba(7,7,11,.7) 100%),
    linear-gradient(180deg,rgba(7,7,11,.4) 0%,transparent 22%,transparent 60%,rgba(7,7,11,.8) 100%);}

  /* ---------- layout ---------- */
  .wrap{position:relative;z-index:3;min-height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:clamp(20px,5vw,40px) 18px clamp(40px,8vw,64px);}
  .col{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;}

  /* barra HUD topo */
  .topbar{width:100%;display:flex;justify-content:space-between;align-items:center;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-bottom:clamp(12px,3vw,22px);}
  .topbar .brand{display:flex;align-items:center;gap:8px;color:var(--muted);}
  .topbar .brand svg{width:15px;height:15px;}
  .topbar .status{display:inline-flex;align-items:center;gap:7px;color:var(--red-2);}
  .topbar .status .dot{width:6px;height:6px;border-radius:50%;background:var(--red-2);box-shadow:0 0 8px var(--red-2);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,52,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,52,0)}100%{box-shadow:0 0 0 0 rgba(255,59,52,0)}}

  /* ---------- ORGCHART: foto no centro + nós de serviços ---------- */
  .org{position:relative;width:min(430px,94vw);aspect-ratio:1/1;margin-top:clamp(4px,2vw,10px);}
  .org__svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
  .org__svg line{stroke:rgba(255,70,58,.35);stroke-width:.5;}
  .org__svg .flow{stroke:var(--red-2);stroke-width:.8;stroke-dasharray:2 7;filter:drop-shadow(0 0 2px var(--red-2));animation:flow 1.4s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-18;}}

  /* foto central — moldura HUD retangular */
  .core{position:absolute;top:50%;left:50%;width:34%;aspect-ratio:1/1;transform:translate(-50%,-50%);}
  .core__frame{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;
    border:1px solid rgba(255,90,74,.45);
    box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 34px rgba(229,36,33,.4),inset 0 0 22px rgba(0,0,0,.5);}
  .core__frame img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;}
  .core__frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(229,36,33,.12),transparent 40%,rgba(7,7,11,.35));mix-blend-mode:overlay;}
  .core__scan{position:absolute;left:0;right:0;height:26%;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(255,90,74,.22),transparent);animation:scan 3.4s var(--ease) infinite;}
  @keyframes scan{0%{top:-26%}100%{top:100%}}
  /* cantos HUD */
  .core b{position:absolute;width:14px;height:14px;border:2px solid var(--red-2);filter:drop-shadow(0 0 4px rgba(255,59,52,.7));}
  .core b.tl{top:-6px;left:-6px;border-right:0;border-bottom:0;}
  .core b.tr{top:-6px;right:-6px;border-left:0;border-bottom:0;}
  .core b.bl{bottom:-6px;left:-6px;border-right:0;border-top:0;}
  .core b.br{bottom:-6px;right:-6px;border-left:0;border-top:0;}
  .core__glow{position:absolute;inset:-30% -30%;z-index:-1;border-radius:50%;
    background:radial-gradient(closest-side,rgba(229,36,33,.4),transparent 70%);filter:blur(6px);animation:breathe 5s var(--ease) infinite;}
  @keyframes breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

  /* nós de serviço */
  .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;
    width:66px;will-change:transform;}
  .node__chip{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;color:#ffd9d1;
    background:linear-gradient(140deg,rgba(255,255,255,.08),rgba(255,255,255,.015)),rgba(24,14,15,.72);
    border:1px solid rgba(255,90,74,.32);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 22px rgba(0,0,0,.5),0 0 16px rgba(229,36,33,.14);
    animation:float 6s var(--ease) infinite;}
  .node__chip svg{width:22px;height:22px;}
  .node__lbl{font-family:var(--fm);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;text-shadow:0 1px 6px #000;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .n1{top:6%;left:50%}.n2{top:19%;left:82%}.n3{top:50%;left:91%}.n4{top:81%;left:82%}
  .n5{top:96%;left:50%}.n6{top:81%;left:18%}.n7{top:50%;left:9%}.n8{top:19%;left:18%}
  .node:nth-child(2n) .node__chip{animation-duration:7.2s;animation-delay:-1.5s;}
  .node:nth-child(3n) .node__chip{animation-duration:8s;animation-delay:-3s;}

  /* ---------- nome + serviços (mono) ---------- */
  .name{margin-top:clamp(16px,3.4vw,26px);font-family:var(--fd);font-weight:800;font-size:clamp(27px,7.4vw,42px);letter-spacing:-.03em;line-height:1.02;text-align:center;white-space:nowrap;text-shadow:0 2px 24px rgba(0,0,0,.6);}
  .svc{margin-top:10px;font-family:var(--fm);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:9px;}
  .svc .tag{color:var(--red-2);}
  .svc .w{color:var(--white);min-width:150px;text-align:left;transition:opacity .35s,transform .35s;}
  .svc .cur{color:var(--red-2);animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}

  /* ---------- ícones sociais ---------- */
  .socials{margin-top:22px;display:flex;gap:12px;}
  .social{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--white);
    background:linear-gradient(140deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),rgba(18,14,15,.7);
    border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 22px rgba(0,0,0,.4);
    transition:transform .3s var(--ease),border-color .3s,box-shadow .3s,color .3s;}
  .social:hover{transform:translateY(-3px);color:#fff;border-color:var(--red-2);box-shadow:0 0 6px rgba(255,59,52,.5),0 0 20px rgba(229,36,33,.35);}
  .social svg{width:20px;height:20px;}

  /* ---------- botões: chrome translúcido holográfico + glitch ---------- */
  .links{margin-top:26px;width:100%;display:flex;flex-direction:column;gap:14px;}
  .lk{position:relative;display:flex;align-items:center;gap:15px;padding:17px 18px;border-radius:14px;overflow:hidden;isolation:isolate;
    background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02)),rgba(20,16,18,.44);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),0 12px 34px rgba(0,0,0,.5);
    transition:transform .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease);will-change:transform;}
  .lk:hover{transform:translateY(-2px);border-color:rgba(255,120,90,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 0 30px rgba(229,36,33,.25),0 16px 40px rgba(0,0,0,.55);}
  .lk:active{transform:translateY(0) scale(.995);}
  /* reflexo holográfico */
  .lk__holo{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:.9;
    background:linear-gradient(115deg,transparent 28%,rgba(255,90,70,.22) 43%,rgba(255,255,255,.34) 50%,rgba(120,170,255,.2) 57%,transparent 72%);
    background-size:250% 100%;animation:holo 6.5s linear infinite;}
  @keyframes holo{0%{background-position:150% 0}100%{background-position:-150% 0}}
  /* camada de glitch/inversão que segue o cursor */
  .lk__glitch{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .1s;
    -webkit-backdrop-filter:invert(1) contrast(1.5) hue-rotate(-12deg);backdrop-filter:invert(1) contrast(1.5) hue-rotate(-12deg);
    -webkit-mask:radial-gradient(70px 70px at var(--mx,50%) var(--my,50%),#000 34%,rgba(0,0,0,.55) 58%,transparent 76%);
    mask:radial-gradient(70px 70px at var(--mx,50%) var(--my,50%),#000 34%,rgba(0,0,0,.55) 58%,transparent 76%);}
  .lk:hover .lk__glitch{opacity:1;animation:glitch .16s steps(2,end) infinite;}
  @keyframes glitch{0%{transform:translate(0,0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,-2px)}80%{transform:translate(2px,1px)}100%{transform:translate(-1px,1px)}}
  .lk > *{position:relative;z-index:0;}
  .lk__ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;
    background:radial-gradient(120% 120% at 30% 15%,rgba(255,90,70,.3),rgba(0,0,0,.35));border:1px solid rgba(255,255,255,.16);}
  .lk__ic svg{width:23px;height:23px;}
  .lk__tx{flex:1;min-width:0;display:flex;flex-direction:column;}
  .lk__t{display:block;font-family:var(--fd);font-weight:700;font-size:16.5px;letter-spacing:-.01em;line-height:1.18;color:#fff;}
  .lk__s{display:block;margin-top:3px;font-size:12.5px;line-height:1.36;color:var(--muted);}
  .lk__go{flex:none;color:var(--muted);transition:transform .3s var(--ease),color .3s;}
  .lk:hover .lk__go{color:var(--red-2);transform:translateX(3px);}
  .lk__go svg{width:19px;height:19px;}

  /* rodapé */
  .foot{margin-top:32px;display:flex;align-items:center;gap:9px;font-family:var(--fm);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);}
  .foot svg{width:17px;height:17px;opacity:.9;}
  .foot a{display:inline-flex;align-items:center;gap:8px;transition:color .3s;}
  .foot a:hover{color:var(--muted);}

  @media (max-width:400px){
    .node{width:56px;}
    .node__chip{width:42px;height:42px;}
    .node__chip svg{width:19px;height:19px;}
    .node__lbl{font-size:7.6px;}
    .lk__t{font-size:15.5px;}
  }
  @media (prefers-reduced-motion:reduce){
    .org__svg .flow,.core__scan,.core__glow,.node__chip,.topbar .status .dot,.lk__holo,.svc .cur{animation:none;}
  }
</style>
</head>

<main class="wrap">

    </div>

    <!-- ORGCHART -->
    <div class="org">
      <svg class="org__svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <g>
          <line x1="50" y1="50" x2="50" y2="6"/><line x1="50" y1="50" x2="82" y2="19"/>
          <line x1="50" y1="50" x2="91" y2="50"/><line x1="50" y1="50" x2="82" y2="81"/>
          <line x1="50" y1="50" x2="50" y2="96"/><line x1="50" y1="50" x2="18" y2="81"/>

          <line class="flow" x1="50" y1="50" x2="91" y2="50" style="animation-delay:-.4s"/><line class="flow" x1="50" y1="50" x2="82" y2="81" style="animation-delay:-.6s"/>
          <line class="flow" x1="50" y1="50" x2="50" y2="96" style="animation-delay:-.8s"/><line class="flow" x1="50" y1="50" x2="18" y2="81" style="animation-delay:-1s"/>

      <!-- núcleo: foto HUD -->

      <!-- nós de serviço -->
      <div class="node n1"><span class="node__chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 8h18"/><circle cx="6" cy="6" r=".6" fill="currentColor"/></svg></span><span class="node__lbl">Sites</span></div>

<script>
// ===== serviços: caption em loop =====
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var s = ["Sites","Landing Pages","Carrosséis","Posts","Criativos","Apresentações","Lançamentos","Identidade Visual"];
  var el = document.getElementById('svcWord'); if(!el) return;
  var i=0;
  setInterval(function(){
    if(reduce){ i=(i+1)%s.length; el.textContent=s[i]; return; }
    el.style.opacity=0; el.style.transform='translateX(6px)';
    setTimeout(function(){ i=(i+1)%s.length; el.textContent=s[i]; el.style.opacity=1; el.style.transform='translateX(0)'; },320);
  }, 2100);
})();

// ===== botões: cursor -> posição do glitch/inversão =====
(function(){
  document.querySelectorAll('.lk').forEach(function(btn){
    btn.addEventListener('pointermove', function(e){
      var r = btn.getBoundingClientRect();
      btn.style.setProperty('--mx', (e.clientX-r.left)+'px');
      btn.style.setProperty('--my', (e.clientY-r.top)+'px');
    }, {passive:true});
  });
})();

// ===== fundo: rede de partículas reativa ao cursor (HUD vermelho) =====
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var c = document.getElementById('net'); if(!c) return;
  var x = c.getContext('2d');
  var W,H,DPR,P=[],N=0,mx=-9999,my=-9999,raf;
  function size(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';
    x.setTransform(DPR,0,0,DPR,0,0);
    N=Math.min(54,Math.round(W*H/26000));
    P=[];for(var i=0;i<N;i++){P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25});}
  }
  size();addEventListener('resize',size);
  addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;},{passive:true});
  addEventListener('pointerleave',function(){mx=-9999;my=-9999;});
  addEventListener('touchmove',function(e){var t=e.touches[0];if(t){mx=t.clientX;my=t.clientY;}},{passive:true});

  var D=118, DM=190;
  function frame(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<N;i++){
      var p=P[i];
      // leve atração ao cursor
      var dxm=mx-p.x, dym=my-p.y, dm2=dxm*dxm+dym*dym;
      if(dm2<DM*DM){ var f=(1-Math.sqrt(dm2)/DM)*.04; p.vx+=dxm*f*.02; p.vy+=dym*f*.02; }
      p.x+=p.vx;p.y+=p.vy;
      p.vx*=.99;p.vy*=.99;
      if(p.x<0)p.x+=W; if(p.x>W)p.x-=W; if(p.y<0)p.y+=H; if(p.y>H)p.y-=H;
    }
    // conexões entre partículas
    for(var a=0;a<N;a++){
      for(var b=a+1;b<N;b++){
        var dx=P[a].x-P[b].x, dy=P[a].y-P[b].y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<D){ var al=(1-d/D)*.16; x.strokeStyle='rgba(255,70,58,'+al.toFixed(3)+')'; x.lineWidth=.6; x.beginPath();x.moveTo(P[a].x,P[a].y);x.lineTo(P[b].x,P[b].y);x.stroke(); }
      }
    }
    // conexões ao cursor + glow
    if(mx>-9998){
      var grd=x.createRadialGradient(mx,my,0,mx,my,DM);
      grd.addColorStop(0,'rgba(229,36,33,.12)');grd.addColorStop(1,'rgba(229,36,33,0)');
      x.fillStyle=grd;x.beginPath();x.arc(mx,my,DM,0,6.2832);x.fill();
      for(var k=0;k<N;k++){
        var ex=P[k].x-mx, ey=P[k].y-my, ed=Math.sqrt(ex*ex+ey*ey);
        if(ed<DM){ var ea=(1-ed/DM)*.5; x.strokeStyle='rgba(255,90,74,'+ea.toFixed(3)+')'; x.lineWidth=.8; x.beginPath();x.moveTo(mx,my);x.lineTo(P[k].x,P[k].y);x.stroke(); }
      }
    }
    // pontos
    for(var m=0;m<N;m++){
      x.fillStyle='rgba(255,90,74,.75)';x.beginPath();x.arc(P[m].x,P[m].y,1.3,0,6.2832);x.fill();
    }
    if(!reduce) raf=requestAnimationFrame(frame);
  }
  if(reduce){ frame(); } else { raf=requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&!reduce){cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);} });
})();
</script>
