<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Otávio Designer — Links</title>
<meta name="description" content="Otávio Designer — HUD de serviços, agência Astrus e portfólio." />
<meta name="theme-color" content="#07070b" />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Otávio Designer" />
<meta property="og:description" content="Design & tecnologia. Serviços, agência Astrus e portfólio." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;800;900&family=Kapakana&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#07070b;
    --white:#f3f4f7;
    --muted:#8a8c96;
    --muted-2:#5c5e68;
    --red:#e52421;
    --red-2:#ff3b34;
    --red-3:#ff7a52;
    --red-deep:#a00000;
    --hud:rgba(255,70,58,.5);
    --hud-soft:rgba(255,70,58,.14);
    --line:rgba(255,255,255,.10);
    --line-2:rgba(255,255,255,.18);
    --ease:cubic-bezier(.16,1,.3,1);
    --fd:"Sora",system-ui,sans-serif;
    --fb:"DM Sans",system-ui,sans-serif;
    --fm:"JetBrains Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;min-height:100svh;background:var(--bg);color:var(--white);font-family:var(--fb);line-height:1.5;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  ::selection{background:var(--red);color:#fff;}

  /* ---------- fundo: Predictive Arc 4 (Originkit, WebGL) ---------- */
  #arcbg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none;}

  /* ---------- fundo: grid HUD + canvas de partículas reativo ---------- */
  .grid{position:fixed;inset:0;z-index:1;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,70,58,.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,70,58,.028) 1px,transparent 1px);
    background-size:46px 46px;
    -webkit-mask:radial-gradient(120% 88% at 50% 36%,#000 52%,transparent 100%);
    mask:radial-gradient(120% 88% at 50% 36%,#000 52%,transparent 100%);}
  .glow{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(46% 34% at 50% 30%,rgba(229,36,33,.10),transparent 70%);
    animation:glowbreathe 7s ease-in-out infinite;}
  @keyframes glowbreathe{0%,100%{opacity:.7}50%{opacity:1}}
  #net{position:fixed;inset:0;z-index:1;display:block;}
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(60% 45% at 50% 34%,rgba(7,7,11,.5) 0%,transparent 70%),
    radial-gradient(140% 120% at 50% 0%,transparent 55%,rgba(7,7,11,.7) 100%),
    linear-gradient(180deg,rgba(7,7,11,.4) 0%,transparent 22%,transparent 60%,rgba(7,7,11,.8) 100%);}

  /* ---------- layout ---------- */
  .wrap{position:relative;z-index:3;min-height:100svh;display:flex;flex-direction:column;align-items:center;
    padding:clamp(20px,5vw,40px) 18px clamp(40px,8vw,64px);}
  .col{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;}

  /* barra HUD topo */
  .topbar{width:100%;display:flex;justify-content:space-between;align-items:center;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-bottom:clamp(12px,3vw,22px);}
  .topbar .brand{display:flex;align-items:center;gap:8px;color:var(--muted);}
  .topbar .brand svg{width:15px;height:15px;}
  .topbar .status{display:inline-flex;align-items:center;gap:7px;color:var(--red-2);animation:slowblink 3.4s ease-in-out infinite;}
  .topbar .status .dot{width:6px;height:6px;border-radius:50%;background:var(--red-2);box-shadow:0 0 8px var(--red-2);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,52,.5)}70%{box-shadow:0 0 0 6px rgba(255,59,52,0)}100%{box-shadow:0 0 0 0 rgba(255,59,52,0)}}
  @keyframes slowblink{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---------- HERO CIRCULAR + HUD ao redor ---------- */
  .org{position:relative;width:min(344px,80vw);aspect-ratio:1/1;margin:clamp(12px,3vw,22px) auto clamp(8px,2vw,14px);}

  /* decoração HUD */
  .hud{position:absolute;inset:0;pointer-events:none;}
  .hud__svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .hud__svg circle{fill:none;}
  .ring-a{stroke:rgba(255,70,58,.14);stroke-width:.35;}
  .ring-in{stroke:rgba(255,80,66,.22);stroke-width:.4;}
  .ring-b{stroke:rgba(255,90,74,.34);stroke-width:.5;stroke-dasharray:2.2 3.4;transform-origin:50% 50%;animation:spin 30s linear infinite;}
  .ring-c{stroke:rgba(255,90,74,.18);stroke-width:.45;stroke-dasharray:.8 7;transform-origin:50% 50%;animation:spin 46s linear infinite reverse;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .tickring{position:absolute;inset:0;border-radius:50%;
    background:repeating-conic-gradient(from 0deg,rgba(255,95,78,.42) 0 .5deg,transparent .5deg 7.5deg);
    -webkit-mask:radial-gradient(circle closest-side,transparent 0 87%,#000 88% 95%,transparent 97%);
            mask:radial-gradient(circle closest-side,transparent 0 87%,#000 88% 95%,transparent 97%);}

  .sweep{position:absolute;inset:0;border-radius:50%;transform-origin:50% 50%;will-change:transform;
    background:conic-gradient(from 0deg,transparent 0deg,transparent 300deg,rgba(255,70,58,.04) 322deg,rgba(255,110,88,.32) 352deg,rgba(255,190,160,.85) 360deg);
    -webkit-mask:radial-gradient(circle closest-side,transparent 0 61%,#000 64% 90%,transparent 93%);
            mask:radial-gradient(circle closest-side,transparent 0 61%,#000 64% 90%,transparent 93%);}

  /* colchetes nos cantos */
  .brk{position:absolute;width:22px;height:22px;border:2px solid rgba(255,90,74,.7);filter:drop-shadow(0 0 4px rgba(255,70,58,.4));}
  .brk.tl{top:6.5%;left:6.5%;border-right:none;border-bottom:none;}
  .brk.tr{top:6.5%;right:6.5%;border-left:none;border-bottom:none;}
  .brk.bl{bottom:6.5%;left:6.5%;border-right:none;border-top:none;}
  .brk.br{bottom:6.5%;right:6.5%;border-left:none;border-top:none;}

  /* micro-labels */
  .hlabel{position:absolute;font-family:var(--fm);font-size:8px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;text-shadow:0 1px 6px #000;color:rgba(255,120,104,.72);}
  .hlabel.t{top:1.5%;left:50%;transform:translateX(-50%);}
  .hlabel.bl{bottom:1.5%;left:6.5%;}
  .hlabel.br{bottom:1.5%;right:6.5%;color:rgba(120,230,160,.72);}

  /* avatar circular */
  .core{position:absolute;top:50%;left:50%;width:88%;aspect-ratio:1/1;transform:translate(-50%,-50%);z-index:2;}
  .core__frame{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
    background:radial-gradient(closest-side,#1a0a0c,#0b0406);
    box-shadow:0 0 0 2px rgba(255,79,79,.92),0 0 22px 3px rgba(255,60,50,.5),0 0 64px 10px rgba(229,36,33,.26),inset 0 0 34px rgba(0,0,0,.30);}
  .core__frame img{width:100%;height:100%;object-fit:cover;object-position:50% 46%;}
  .core__glow{position:absolute;inset:-20%;z-index:-1;border-radius:50%;
    background:radial-gradient(closest-side,rgba(229,36,33,.42),transparent 72%);filter:blur(12px);animation:breathe 5s var(--ease) infinite;}
  @keyframes breathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.05)}}

  /* nós de serviço (orbitando o círculo) */
  .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;
    width:66px;opacity:0;will-change:opacity;z-index:3;}
  .node__chip{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#ffd9d1;
    background:linear-gradient(140deg,rgba(255,255,255,.08),rgba(255,255,255,.015)),rgba(24,14,15,.72);
    border:1px solid rgba(255,90,74,calc(.32 + var(--ping,0)*.6));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 22px rgba(0,0,0,.5),0 0 calc(10px + var(--ping,0)*26px) rgba(255,90,74,calc(.12 + var(--ping,0)*.7));
    transform:scale(calc(1 + var(--ping,0)*.14));transition:transform .18s var(--ease);}
  .node__chip svg{width:21px;height:21px;}
  .node__lbl{font-family:var(--fm);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;text-shadow:0 1px 6px #000;}

  /* ---------- nome + serviços (mono) ---------- */
  .name{position:relative;z-index:5;margin-top:clamp(12px,2.6vw,20px);text-align:center;}
  .name .ov{display:block;font-family:"Orbitron",var(--fd);font-weight:800;font-size:clamp(28px,7.4vw,46px);letter-spacing:.03em;line-height:1;text-transform:uppercase;color:#f3f4f7;text-shadow:0 2px 20px rgba(0,0,0,.6);}
  .name .dz{display:block;font-family:"Kapakana","Orbitron",cursive;font-weight:400;font-size:clamp(76px,22vw,140px);line-height:.72;margin-top:-.24em;padding-bottom:.28em;
    background:linear-gradient(100deg,#5a0202 0%,#c70003 24%,#ff7a68 42%,#ffffff 50%,#ff7a68 58%,#c70003 76%,#5a0202 100%);
    background-size:230% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 7px rgba(0,0,0,.55));animation:metal 4.6s linear infinite;}
  @keyframes metal{to{background-position:-230% 0}}
  .svc{margin-top:10px;width:100%;font-family:var(--fm);font-size:clamp(11px,3.1vw,13px);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:center;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .svc .tag{color:var(--red-2);white-space:nowrap;}
  .svc .w{color:var(--white);white-space:nowrap;transition:opacity .3s;}
  .svc .cur{color:var(--red-2);animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}

  /* ---------- ícones sociais ---------- */
  .socials{margin-top:22px;display:flex;gap:12px;}
  .social{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--white);
    background:linear-gradient(140deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),rgba(18,14,15,.7);
    border:1px solid var(--line-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 22px rgba(0,0,0,.4);
    transition:transform .3s var(--ease),border-color .3s,box-shadow .3s,color .3s;}
  .social:hover{transform:translateY(-3px);color:#fff;border-color:var(--red-2);box-shadow:0 0 6px rgba(255,59,52,.5),0 0 20px rgba(229,36,33,.35);}
  .social svg{width:20px;height:20px;}

  /* ---------- botões: chrome translúcido holográfico + glitch ---------- */
  .links{margin-top:26px;width:100%;display:flex;flex-direction:column;gap:14px;}
  .lk{position:relative;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;isolation:isolate;
    background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.015)),rgba(16,13,15,.5);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 16px 40px rgba(0,0,0,.5);
    transition:transform .3s var(--ease),border-color .3s var(--ease),box-shadow .3s var(--ease);will-change:transform;}
  .lk:hover{transform:translateY(-3px);border-color:rgba(255,120,90,.55);box-shadow:0 0 30px rgba(229,36,33,.22),0 22px 50px rgba(0,0,0,.55);}
  /* borda com brilho que passa (border beam) no hover */
  @property --beam{syntax:'<angle>';inherits:false;initial-value:0deg;}
  .lk::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;z-index:6;pointer-events:none;opacity:0;transition:opacity .35s var(--ease);
    background:conic-gradient(from var(--beam,0deg),transparent 0deg,transparent 60%,rgba(255,90,74,.5) 74%,#fff 82%,rgba(255,90,74,.5) 90%,transparent 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;}
  .lk:hover::after{opacity:1;animation:beamspin 2.2s linear infinite;}
  @keyframes beamspin{to{--beam:360deg;}}
  .lk:active{transform:translateY(-1px) scale(.996);}
  .lk__art{position:relative;width:100%;aspect-ratio:323/186;overflow:hidden;background:#120a0b;}
  .lk__art img{width:100%;height:100%;object-fit:cover;display:block;}
  .lk__art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(9,6,7,.72));}
  /* reflexo holográfico */
  .lk__holo{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen;opacity:.7;
    background:linear-gradient(115deg,transparent 30%,rgba(255,90,70,.18) 45%,rgba(255,255,255,.28) 50%,rgba(120,170,255,.16) 56%,transparent 72%);
    background-size:250% 100%;animation:holo 6.5s linear infinite;}
  @keyframes holo{0%{background-position:150% 0}100%{background-position:-150% 0}}
  .lk__row{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:14px 16px;}
  .lk__ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;overflow:hidden;
    background:radial-gradient(120% 120% at 30% 15%,rgba(255,90,70,.3),rgba(0,0,0,.4));border:1px solid rgba(255,255,255,.16);}
  .lk__ic svg,.lk__ic img{width:24px;height:24px;object-fit:contain;}
  .lk__tx{flex:1;min-width:0;display:flex;flex-direction:column;}
  .lk__t{display:block;font-family:var(--fd);font-weight:700;font-size:16.5px;letter-spacing:-.01em;line-height:1.18;color:#fff;}
  .lk__s{display:block;margin-top:3px;font-size:12.5px;line-height:1.36;color:var(--muted);}
  .lk__go{flex:none;color:var(--muted);font-size:18px;line-height:1;transition:transform .3s var(--ease),color .3s;}
  .lk:hover .lk__go{color:var(--red-2);transform:translateX(3px);}

  /* rodapé */
  .foot{margin-top:32px;display:flex;align-items:center;gap:9px;font-family:var(--fm);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);}
  .foot svg{width:17px;height:17px;opacity:.9;}
  .foot a{display:inline-flex;align-items:center;gap:8px;transition:color .3s;}
  .foot a:hover{color:var(--muted);}

  @media (max-width:400px){
    .node{width:56px;}
    .node__chip{width:42px;height:42px;}
    .node__chip svg{width:19px;height:19px;}
    .node__lbl{font-size:7.6px;}
    .lk__t{font-size:15.5px;}
  }
  @media (prefers-reduced-motion:reduce){
    .core__glow,.glow,.topbar .status,.topbar .status .dot,.lk__holo,.svc .cur,.name .dz{animation:none;}
  }
</style>
</head>
<body>

<canvas id="arcbg" aria-hidden="true"></canvas>
<div class="grid" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>
<canvas id="net" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main class="wrap">
  <div class="col">

    <!-- TOPBAR HUD -->
    <div class="topbar">
      <span class="brand">
        <svg viewBox="0 0 290.93 304.8" xmlns="http://www.w3.org/2000/svg"><path fill="#e52421" d="M290.93,71.69l-.13,131.99c0,6.1-2.88,13.15-7.1,17.42l-74.74,75.44c-5.69,5.74-13.1,8.21-21.15,8.21l-114.3-.03c-9.95.86-17.98-6.04-18.5-16.28.41-4.67,1.79-9.04,5.02-12.28l35.76-35.93c4.37-4.39,10.68-7.1,16.93-7.1l98.9-.07c1.73,0,3.44-.29,5.07-.81,2.61-.83,4.98-2.28,6.83-4.14,3.41-3.45,4.78-8.1,4.78-13.05v-123.83c.01-4.63,1.86-9.67,4.97-12.81l32.91-33.33c1.65-1.67,4.24-1.36,5.77.17l13.88,13.87c3.11,3.11,5.13,7.88,5.13,12.56Z"/><path fill="#e52421" d="M0,233.1L.13,101.12c0-6.1,2.88-13.15,7.1-17.42L81.97,8.25C87.67,2.51,95.08.04,103.12.04l114.3.03c9.95-.86,17.98,6.04,18.5,16.28-.41,4.67-1.79,9.04-5.02,12.28l-35.76,35.93c-4.37,4.39-10.68,7.1-16.93,7.1l-98.9.07c-1.73,0-3.44.29-5.07.81-2.61.83-4.98,2.28-6.83,4.14-3.41,3.45-4.78,8.1-4.78,13.05v123.83c-.01,4.63-1.86,9.67-4.97,12.81l-32.91,33.33c-1.65,1.67-4.24,1.36-5.77-.17l-13.88-13.87C2.02,242.55,0,237.79,0,233.1Z"/></svg>
        OTÁVIO DESIGNER
      </span>
      <span class="status"><span class="dot"></span>Disponível p/ projetos</span>
    </div>

    <!-- HERO: só o círculo -->
    <div class="org">
      <div class="core">
        <span class="core__glow"></span>
        <div class="core__frame"><img src="assets/avatar.webp" alt="Otávio Designer" /></div>
      </div>
    </div>

    <!-- NOME + SERVIÇOS -->
    <h1 class="name"><span class="ov">Otávio</span><span class="dz">Designer</span></h1>
    <div class="svc"><span class="tag">SERVIÇOS //</span><span class="w" id="svcWord">Sites</span><span class="cur">▍</span></div>

    <!-- SOCIAIS -->
    <div class="socials">
      <a class="social" href="https://www.instagram.com/otaviodesigner1/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5.4"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a class="social" href="https://wa.me/5535991409445" target="_blank" rel="noopener" aria-label="WhatsApp">

      </a>
    </div>

<script>
// ===== serviços: caption em loop =====
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var s = ["Sites / LP","Criativos","Carrossel","Lançamentos","Identidade Visual"];
  var el = document.getElementById('svcWord'); if(!el) return;
  var i=0;
  setInterval(function(){
    if(reduce){ i=(i+1)%s.length; el.textContent=s[i]; return; }
    el.style.opacity=0;
    setTimeout(function(){ i=(i+1)%s.length; el.textContent=s[i]; el.style.opacity=1; },300);
  }, 2100);
})();

// ===== RADAR: varredura revela/apaga os serviços em loop =====
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var org = document.querySelector('.org');
  var sweep = document.querySelector('.sweep');
  var nodes = Array.prototype.slice.call(document.querySelectorAll('.node'));
  if(!org || !nodes.length) return;
  // nós orbitando o círculo: topo, 2 à direita, 2 à esquerda
  var angs = [0, 62, 118, 242, 298], R = 41;
  function place(){
    for(var i=0;i<nodes.length;i++){
      var a = angs[i]*Math.PI/180;
      nodes[i].style.left = (50 + R*Math.sin(a)).toFixed(2)+'%';
      nodes[i].style.top  = (50 - R*Math.cos(a)).toFixed(2)+'%';
    }
  }
  place(); window.addEventListener('resize', place);
  function adist(a,b){ return Math.abs(((a-b+540)%360)-180); }
  if(reduce){ nodes.forEach(function(n){n.style.opacity=1;}); if(sweep) sweep.style.display='none'; return; }
  var lit = nodes.map(function(){return 0;}), raf;
  function loop(now){
    var s = (now*0.03) % 360;                    // varredura de círculo completo (~12s/volta)
    if(sweep) sweep.style.transform = 'rotate('+s+'deg)';
    for(var i=0;i<nodes.length;i++){
      if(adist(s,angs[i]) < 7) lit[i]=1; else lit[i]*=0.955;  // acende ao passar, some depois
      var op = lit[i];
      nodes[i].style.opacity = (0.55 + 0.45*op).toFixed(3);
      var chip = nodes[i].firstElementChild;
      if(chip) chip.style.setProperty('--ping', op.toFixed(3));
    }
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); } });
})();

// ===== fundo: rede de partículas reativa ao cursor (HUD vermelho) =====
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var c = document.getElementById('net'); if(!c) return;
  var x = c.getContext('2d');
  var W,H,DPR,P=[],N=0,mx=-9999,my=-9999,raf;
  function size(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;
    c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';
    x.setTransform(DPR,0,0,DPR,0,0);
    N=Math.min(40,Math.round(W*H/34000));
    P=[];for(var i=0;i<N;i++){P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15,vy:(Math.random()-.5)*.15});}
  }
  size();addEventListener('resize',size);
  addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;},{passive:true});
  addEventListener('pointerleave',function(){mx=-9999;my=-9999;});
  addEventListener('touchmove',function(e){var t=e.touches[0];if(t){mx=t.clientX;my=t.clientY;}},{passive:true});

  var D=118, DM=190;
  function frame(){
    x.clearRect(0,0,W,H);
    for(var i=0;i<N;i++){
      var p=P[i];
      // leve atração ao cursor
      var dxm=mx-p.x, dym=my-p.y, dm2=dxm*dxm+dym*dym;
      if(dm2<DM*DM){ var f=(1-Math.sqrt(dm2)/DM)*.04; p.vx+=dxm*f*.02; p.vy+=dym*f*.02; }
      p.x+=p.vx;p.y+=p.vy;
      p.vx*=.99;p.vy*=.99;
      if(p.x<0)p.x+=W; if(p.x>W)p.x-=W; if(p.y<0)p.y+=H; if(p.y>H)p.y-=H;
    }
    // conexões entre partículas
    for(var a=0;a<N;a++){
      for(var b=a+1;b<N;b++){
        var dx=P[a].x-P[b].x, dy=P[a].y-P[b].y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<D){ var al=(1-d/D)*.085; x.strokeStyle='rgba(255,70,58,'+al.toFixed(3)+')'; x.lineWidth=.6; x.beginPath();x.moveTo(P[a].x,P[a].y);x.lineTo(P[b].x,P[b].y);x.stroke(); }
      }
    }
    // conexões ao cursor + glow
    if(mx>-9998){
      var grd=x.createRadialGradient(mx,my,0,mx,my,DM);
      grd.addColorStop(0,'rgba(229,36,33,.12)');grd.addColorStop(1,'rgba(229,36,33,0)');
      x.fillStyle=grd;x.beginPath();x.arc(mx,my,DM,0,6.2832);x.fill();
      for(var k=0;k<N;k++){
        var ex=P[k].x-mx, ey=P[k].y-my, ed=Math.sqrt(ex*ex+ey*ey);
        if(ed<DM){ var ea=(1-ed/DM)*.5; x.strokeStyle='rgba(255,90,74,'+ea.toFixed(3)+')'; x.lineWidth=.8; x.beginPath();x.moveTo(mx,my);x.lineTo(P[k].x,P[k].y);x.stroke(); }
      }
    }
    // pontos
    for(var m=0;m<N;m++){
      x.fillStyle='rgba(255,110,90,.3)';x.beginPath();x.arc(P[m].x,P[m].y,1,0,6.2832);x.fill();
    }
    if(!reduce) raf=requestAnimationFrame(frame);
  }
  if(reduce){ frame(); } else { raf=requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&!reduce){cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);} });
})();
</script>

(function(){

"uniform vec2  uPtr;\n"+
"uniform float uA, uB, uC, uD;\n"+
"uniform vec3  uBg, uBase, uAccent, uHigh;\n"+
"\n"+
"void main(){\n"+
"  float cs = max(uCell, 2.0);\n"+
"  vec2 ci = floor(gl_FragCoord.xy / cs);\n"+
"  vec2 cc = (ci + 0.5) * cs;\n"+
"\n"+
"  float x = cc.x / uDpr;\n"+
"  float y = (uRes.y - cc.y) / uDpr;\n"+
"  float w = uRes.x / uDpr;\n"+
"  float h = uRes.y / uDpr;\n"+
"  float t = uTime;\n"+
"\n"+
"  float i = 0.0;\n"+
"  float leanX = (uPtr.x - w * 0.5) * 0.5 * uHover;\n"+
"  float leanY = (uPtr.y - h * 0.5) * 0.25 * uHover;\n"+
"  float n1 = max(uA, 1.0);\n"+
"  for (int n = 0; n < 8; n++) {\n"+
"    float fn = float(n);\n"+
"    if (fn >= n1) break;\n"+
"    float par = 1.0 - 0.6 * fn / n1;\n"+
"    float cx = w * 0.5 + leanX * par;\n"+
"    float normX = (x - cx) / (w * 0.75);\n"+
"    float curveY = h * 0.3 + fn * h * uB + leanY * par\n"+
"                 + normX * normX * h * uC * (1.0 + 0.08 * fn);\n"+
"    float th = (40.0 + (1.0 - min(abs(normX), 1.0)) * 25.0) * uD;\n"+
"    float dist = abs(y - curveY);\n"+
"    if (dist < th) {\n"+
"      float b = 1.0 - dist / th;\n"+
"      float waveX = sin(x * 0.015 + t);\n"+

    gl.uniform3f(u("uBase"), cb[0],cb[1],cb[2]);
    gl.uniform3f(u("uAccent"), ca[0],ca[1],ca[2]);
    gl.uniform3f(u("uHigh"), chh[0],chh[1],chh[2]);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    raf = requestAnimationFrame(render);
  }

  function track(e){
    var r = canvas.getBoundingClientRect();
    if (r.width <= 0 || r.height <= 0) return;
    ptr.tx = clampN((e.clientX - r.left) / r.width, 0, 1);
    ptr.ty = clampN((e.clientY - r.top) / r.height, 0, 1);
  }
  function onLeave(){ ptr.tx = 0.5; ptr.ty = 0.5; }
  window.addEventListener("pointermove", track, { passive:true });
  window.addEventListener("pointerleave", onLeave);

  raf = requestAnimationFrame(render);
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) { last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }
  });
})();
</script>
</body>
</html>
